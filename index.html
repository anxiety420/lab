<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Інформаційна Сторінка</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Вітаємо на нашій сторінці!</h1>
  <button onclick="toggleTheme()">Перемкнути тему</button>

  <div id="comments"></div>

  <footer id="footerInfo"></footer>

  <div class="modal" id="feedbackModal">
    <div class="modal-content">
      <h2>Форма зворотного зв'язку</h2>
      <form action="https://formspree.io/f/xgvkkyrn" method="POST">
        <input type="text" name="name" placeholder="Ім'я" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="tel" name="phone" placeholder="Телефон" required><br>
        <textarea name="message" placeholder="Ваше повідомлення" required></textarea><br>
        <button type="submit">Відправити</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
